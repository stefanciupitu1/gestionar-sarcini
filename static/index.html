mkdir -p ~/Desktop && cat > ~/Desktop/index.html << 'SFARSIT'
<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestionar de sarcini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand fw-bold">Gestionar de sarcini</span>
        <div id="info-utilizator" class="d-none align-items-center gap-3">
            <span id="email-utilizator" class="text-white small"></span>
            <span id="contor-sarcini" class="badge bg-light text-primary"></span>
            <button class="btn btn-outline-light btn-sm" onclick="deconecteaza()">Deconectare</button>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div id="sectiune-auth">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div id="form-inregistrare" class="card">
                    <div class="card-body">
                        <h5 class="card-title">Inregistrare</h5>
                        <div id="eroare-inregistrare" class="alert alert-danger d-none"></div>
                        <div id="succes-inregistrare" class="alert alert-success d-none"></div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="reg-email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parola</label>
                            <input type="password" id="reg-parola" class="form-control">
                        </div>
                        <button class="btn btn-primary w-100" onclick="inregistreaza()">Inregistreaza-te</button>
                        <p class="text-center mt-3 mb-0">Ai deja cont? <a href="#" onclick="comutaFormular(); return false;">Autentifica-te</a></p>
                    </div>
                </div>
                <div id="form-autentificare" class="card d-none">
                    <div class="card-body">
                        <h5 class="card-title">Autentificare</h5>
                        <div id="eroare-autentificare" class="alert alert-danger d-none"></div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" id="auth-email" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Parola</label>
                            <input type="password" id="auth-parola" class="form-control">
                        </div>
                        <button class="btn btn-primary w-100" onclick="autentifica()">Conecteaza-te</button>
                        <p class="text-center mt-3 mb-0">Nu ai cont? <a href="#" onclick="comutaFormular(); return false;">Inregistreaza-te</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="sectiune-sarcini" class="d-none">
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Adauga o sarcina</h5>
                <div class="mb-3">
                    <input type="text" id="sarcina-titlu" class="form-control" placeholder="Titlu">
                </div>
                <div class="mb-3">
                    <textarea id="sarcina-descriere" class="form-control" placeholder="Descriere (optional)" rows="2"></textarea>
                </div>
                <button class="btn btn-success" onclick="adaugaSarcina()">Adauga</button>
            </div>
        </div>
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="doar-nefinalizate" onchange="incarcaSarcini()">
            <label class="form-check-label" for="doar-nefinalizate">Afiseaza doar sarcinile nefinalizate</label>
        </div>
        <h5>Sarcinile mele</h5>
        <div id="lista-sarcini"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = "";
function salveazaToken(t) { localStorage.setItem("token", t); }
function obtineToken() { return localStorage.getItem("token"); }
function deconecteaza() { localStorage.removeItem("token"); actualizeazaUI(); }
function actualizeazaUI() {
    const token = obtineToken();
    if (token) {
        document.getElementById("sectiune-auth").classList.add("d-none");
        document.getElementById("sectiune-sarcini").classList.remove("d-none");
        document.getElementById("info-utilizator").classList.remove("d-none");
        document.getElementById("info-utilizator").classList.add("d-flex");
        try { const p = JSON.parse(atob(token.split(".")[1])); document.getElementById("email-utilizator").textContent = p.sub; } catch(e) {}
        incarcaSarcini();
    } else {
        document.getElementById("sectiune-auth").classList.remove("d-none");
        document.getElementById("sectiune-sarcini").classList.add("d-none");
        document.getElementById("info-utilizator").classList.add("d-none");
        document.getElementById("info-utilizator").classList.remove("d-flex");
    }
}
function comutaFormular() {
    document.getElementById("form-inregistrare").classList.toggle("d-none");
    document.getElementById("form-autentificare").classList.toggle("d-none");
}
async function inregistreaza() {
    ascundeEroare("eroare-inregistrare"); ascundeEroare("succes-inregistrare");
    const email = document.getElementById("reg-email").value;
    const parola = document.getElementById("reg-parola").value;
    try {
        const r = await fetch(API+"/inregistrare", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({email,parola})});
        if (!r.ok) { const e = await r.json(); afiseazaEroare("eroare-inregistrare", e.detail||"Eroare."); return; }
        afiseazaSucces("succes-inregistrare", "Cont creat! Te poti autentifica.");
        setTimeout(comutaFormular, 1500);
    } catch(e) { afiseazaEroare("eroare-inregistrare", "Nu se poate contacta serverul."); }
}
async function autentifica() {
    ascundeEroare("eroare-autentificare");
    const email = document.getElementById("auth-email").value;
    const parola = document.getElementById("auth-parola").value;
    const df = new URLSearchParams();
    df.append("username", email); df.append("password", parola);
    try {
        const r = await fetch(API+"/autentificare", {method:"POST", body:df});
        if (!r.ok) { afiseazaEroare("eroare-autentificare", "Email sau parola incorecte."); return; }
        const d = await r.json(); salveazaToken(d.access_token); actualizeazaUI();
    } catch(e) { afiseazaEroare("eroare-autentificare", "Nu se poate contacta serverul."); }
}
async function incarcaSarcini() {
    const token = obtineToken();
    const filtru = document.getElementById("doar-nefinalizate").checked;
    const url = filtru ? API+"/sarcini?doar_nefinalizate=true" : API+"/sarcini";
    try {
        const r = await fetch(url, {headers:{"Authorization":"Bearer "+token}});
        if (r.status===401) { deconecteaza(); return; }
        if (!r.ok) return;
        randeazaSarcini(await r.json());
    } catch(e) { document.getElementById("lista-sarcini").innerHTML='<div class="alert alert-warning">Nu se poate contacta serverul.</div>'; }
}
function randeazaSarcini(sarcini) {
    const container = document.getElementById("lista-sarcini");
    const fin = sarcini.filter(s=>s.finalizata).length;
    document.getElementById("contor-sarcini").textContent = sarcini.length+" sarcini / "+fin+" finalizate";
    if (!sarcini.length) { container.innerHTML='<p class="text-muted">Nicio sarcina adaugata inca.</p>'; return; }
    container.innerHTML = sarcini.map(s=>`
        <div class="card mb-2" id="card-${s.id}">
            <div class="card-body d-flex justify-content-between align-items-start">
                <div class="col-md-8">
                    <h6>${escapeHtml(s.titlu)} <span class="badge ${s.finalizata?'bg-success':'bg-secondary'} ms-2">${s.finalizata?'Finalizata':'In progres'}</span></h6>
                    <p class="text-muted mb-0 small">${escapeHtml(s.descriere||'')}</p>
                </div>
                <div class="d-flex gap-2 ms-3 flex-shrink-0">
                    <button class="btn btn-sm btn-outline-success" onclick="finalizeazaSarcina(${s.id})" ${s.finalizata?'disabled':''}>Finalizeaza</button>
                    <button class="btn btn-sm btn-outline-primary" onclick="editeazaSarcina(${s.id},'${escapeAttr(s.titlu)}','${escapeAttr(s.descriere||'')}')">Editeaza</button>
                    <button class="btn btn-sm btn-outline-danger" onclick="stergeSarcina(${s.id})">Sterge</button>
                </div>
            </div>
        </div>`).join("");
}
async function adaugaSarcina() {
    const titlu = document.getElementById("sarcina-titlu").value.trim();
    if (!titlu) return;
    const token = obtineToken();
    try {
        const r = await fetch(API+"/sarcini", {method:"POST", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify({titlu, descriere:document.getElementById("sarcina-descriere").value.trim()})});
        if (r.ok) { document.getElementById("sarcina-titlu").value=""; document.getElementById("sarcina-descriere").value=""; incarcaSarcini(); }
    } catch(e) { alert("Nu se poate contacta serverul."); }
}
async function finalizeazaSarcina(id) {
    const token = obtineToken();
    try {
        const r = await fetch(API+"/sarcini/"+id+"/finaliza", {method:"PATCH", headers:{"Authorization":"Bearer "+token}});
        if (r.ok) incarcaSarcini();
    } catch(e) { alert("Nu se poate contacta serverul."); }
}
async function editeazaSarcina(id, titluCurent, descriereCurenta) {
    const card = document.getElementById("card-"+id);
    card.querySelector(".card-body").innerHTML = `
        <div class="col-md-8">
            <input type="text" class="form-control mb-2" id="edit-titlu-${id}" value="${escapeAttr(titluCurent)}">
            <textarea class="form-control small" id="edit-descriere-${id}" rows="2">${escapeHtml(descriereCurenta)}</textarea>
        </div>
        <div class="d-flex gap-2 ms-3 flex-shrink-0 align-items-start">
            <button class="btn btn-sm btn-success" onclick="salveazaEditare(${id})">Salveaza</button>
            <button class="btn btn-sm btn-secondary" onclick="incarcaSarcini()">Anuleaza</button>
        </div>`;
}
async function salveazaEditare(id) {
    const titlu = document.getElementById("edit-titlu-"+id).value.trim();
    const descriere = document.getElementById("edit-descriere-"+id).value.trim();
    if (!titlu) return;
    const token = obtineToken();
    try {
        const r = await fetch(API+"/sarcini/"+id, {method:"PUT", headers:{"Content-Type":"application/json","Authorization":"Bearer "+token}, body:JSON.stringify({titlu,descriere})});
        if (r.ok) incarcaSarcini();
    } catch(e) { alert("Nu se poate contacta serverul."); }
}
async function stergeSarcina(id) {
    if (!window.confirm("Esti sigur ca vrei sa stergi aceasta sarcina?")) return;
    const token = obtineToken();
    try {
        const r = await fetch(API+"/sarcini/"+id, {method:"DELETE", headers:{"Authorization":"Bearer "+token}});
        if (r.ok) incarcaSarcini();
    } catch(e) { alert("Nu se poate contacta serverul."); }
}
function afiseazaEroare(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.remove("d-none"); }
function afiseazaSucces(id, msg) { const e=document.getElementById(id); e.textContent=msg; e.classList.remove("d-none"); }
function ascundeEroare(id) { document.getElementById(id).classList.add("d-none"); }
function escapeHtml(t) { const d=document.createElement("div"); d.textContent=String(t); return d.innerHTML; }
function escapeAttr(t) { return String(t).replace(/'/g,"&#39;").replace(/"/g,"&quot;"); }
document.addEventListener("DOMContentLoaded", actualizeazaUI);
</script>
</body>
</html>
SFARSIT
